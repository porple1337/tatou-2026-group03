version: "3.9"

services:
  server:
    build:
      context: server
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    volumes:
      - user-files:/app/storage
      - ./server/server_pub.asc:/run/secrets/server_pub.asc:ro
      - ./server/server_priv.asc:/run/secrets/server_priv.asc:ro

    environment:
      - PYTHONUNBUFFERED=1

      # Database connection
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=tatou
      - DB_USER=${MARIADB_USER}
      - DB_PASSWORD=${MARIADB_PASSWORD}
      - FLAG_2=${FLAG_2}

      - RMAP_SERVER_PUBLIC_KEY=/run/secrets/server_pub.asc
      - RMAP_SERVER_PRIVATE_KEY=/run/secrets/server_priv.asc
      - RMAP_CLIENT_KEYS_DIR=/app/src/public_keys
      - RMAP_SOURCE_DOCUMENT_ID=${RMAP_SOURCE_DOCUMENT_ID}
      - RMAP_WATERMARK_METHOD=omar-watermark
      - RMAP_WATERMARK_KEY=${RMAP_WATERMARK_KEY}
      - RMAP_SERVER_PASSPHRASE=${RMAP_SERVER_PASSPHRASE}

    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=tatou
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./db/tatou.sql:/docker-entrypoint-initdb.d/10-tatou.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root --password=$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3306:3306"
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - UPLOAD_LIMIT=64M
      - MEMORY_LIMIT=256M
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  user-files:
